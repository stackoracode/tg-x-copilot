[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tg-x-copilot"
version = "0.1.0"
description = "Telegram -> X publishing copilot: scores, rewrites and prepares original English X drafts from forwarded Telegram content."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "telethon>=1.36",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyMySQL>=1.1",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "Pillow>=10.3",
]

[project.optional-dependencies]
fast = ["cryptg>=0.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
tg-x-copilot = "tg_x_copilot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_x_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
