{% extends "base.html" %}
{% block title %}Health{% endblock %}
{% block content %}
<div class="card">
  <h3 style="margin-top:0">Connection test</h3>
  <table>
    <tr><th>Service</th><th>Status</th><th>Latency</th><th>Detail</th></tr>
    {% for r in results %}
    <tr><td>{{ r.name }}</td><td class="{{ 'ok' if r.ok else 'bad' }}">{{ "OK" if r.ok else "FAIL" }}</td><td>{{ r.latency_ms }} ms</td><td><code>{{ r.detail }}</code></td></tr>
    {% endfor %}
  </table>
  <p><a href="/actions/health"><button type="button">Run again</button></a></p>
</div>
{% endblock %}
